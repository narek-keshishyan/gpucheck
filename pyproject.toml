[project]
name = "gpucheck-cli"
version = "0.1.0"
description = "Open-source CLI that health-checks NVIDIA GPUs"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "narekkeshishyan", email = "keshishyan01@gmail.com" }
]
requires-python = ">=3.10"
dependencies = ["pynvml"]

[project.optional-dependencies]
load = ["torch"]

[project.urls]
Homepage = "https://gpucheck.dev"
Repository = "https://github.com/narek-keshishyan/gpucheck"

[project.scripts]
gpucheck = "gpucheck.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Distribution is gpucheck-cli (the bare name is taken on PyPI); import package stays gpucheck.
module-name = "gpucheck"
